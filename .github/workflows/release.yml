name: Create GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a release for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        env:
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$PUSH_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION."
            exit 1
          fi

      - name: Test and build
        run: npm run test:release

      - name: Create package archive
        run: npm pack --cache .tmp-npm-cache

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/js-player-module-brightcove.js \
            js-player-module-brightcove-*.tgz \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
